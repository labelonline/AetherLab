<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AetherLab</title>
<script>
(function(){
    var base = 'https://labelonline.github.io/AetherLab/';
    var known = new Set([
        '/dashboard','/new-release','/releases','/drafts','/moderation','/fixes',
        '/news','/instruction','/support','/support-ticket','/cabinets',
        '/admin-releases','/deleted','/content-manager','/lyrics-karaoke',
        '/promo-links','/questionnaires'
    ]);
    try {
        var p = location.pathname || '';
        if(p.indexOf('/AetherLab/') === 0) p = '/' + p.slice('/AetherLab/'.length);
        p = p.replace(/\/$/, '') || '/dashboard';
        if(known.has(p)) sessionStorage.setItem('aetherlab_last_route_v1', p);
    } catch(e) {}
    location.replace(base);
})();
</script>
</head>
<body>
<a href="https://labelonline.github.io/AetherLab/">AetherLab</a>
</body>
</html>
